name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (app, relay, shared)
        run: npm run lint

      - name: Typecheck relay (tsc --noEmit)
        run: npm run typecheck:relay

      - name: Build app
        run: npm run build

      - name: Test (shared, app, relay)
        run: npm test

      - name: Audit production dependencies (fail only on critical)
        run: npm audit --omit=dev --audit-level=critical

  android:
    name: Android native build (play + field)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Capacitor 7's android library requires JDK 21 to compile.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v4

      - name: Sync web build into the Android project
        run: npm run cap:sync

      - name: Assemble debug APKs (play + field flavors)
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Assemble release APKs (unsigned, play + field flavors)
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon

  docker:
    name: Docker build smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: setu-relay:ci
